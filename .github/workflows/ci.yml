name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicalka
          POSTGRES_PASSWORD: medicalka
          POSTGRES_DB: medicalka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medicalka -d medicalka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg2://medicalka:medicalka@localhost:5432/medicalka_test
      TEST_DATABASE_URL: postgresql+psycopg2://medicalka:medicalka@localhost:5432/medicalka_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: pytest -q
